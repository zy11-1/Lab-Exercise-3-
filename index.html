<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 3 - WeatherNow</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>WeatherNow Dashboard</h1>
        
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name (e.g., Kuala Lumpur)">
            <button id="searchBtn">Search</button>
        </div>

        <div id="errorBanner" class="error-banner" style="display: none;"></div>

        <div class="current-weather card">
            <h2 id="cityName" class="skeleton">City Name Placeholder</h2>
            <div class="weather-main">
                <span id="temp" class="skeleton">--°C</span>
                <span id="desc" class="skeleton">Description</span>
            </div>
            <div class="weather-details">
                <p>Humidity: <span id="humidity" class="skeleton">--%</span></p>
                <p>Wind: <span id="windSpeed" class="skeleton">-- km/h</span></p>
                <p>Local Time: <span id="localTime" class="skeleton">--:--</span></p>
            </div>
        </div>

        <h3>7-Day Forecast</h3>
        <div id="forecast" class="forecast-container"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
